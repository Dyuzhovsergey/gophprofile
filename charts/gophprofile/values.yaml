nameOverride: ""
fullnameOverride: ""

namespaceOverride: ""

commonLabels:
  app.kubernetes.io/part-of: gophprofile

server:
  enabled: true

  replicaCount: 1

  image:
    repository: docker.io/library/gophprofile-server
    tag: local
    pullPolicy: Never

  containerPort: 8080

  service:
    type: ClusterIP
    httpPort: 80
    metricsPort: 9090

  terminationGracePeriodSeconds: 30

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    startup:
      enabled: true
      path: /live
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30

    liveness:
      enabled: true
      path: /live
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

    readiness:
      enabled: true
      path: /ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

worker:
  enabled: true

  replicaCount: 1

  image:
    repository: docker.io/library/gophprofile-worker
    tag: local
    pullPolicy: Never

  containerPort: 9091

  service:
    type: ClusterIP
    metricsPort: 9091

  terminationGracePeriodSeconds: 60

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    startup:
      enabled: true
      path: /live
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30

    liveness:
      enabled: true
      path: /live
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

    readiness:
      enabled: true
      path: /ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

config:
  logLevel: info

  serverAddress: ":8080"
  workerMetricsAddress: ":9091"
  maxUploadSizeBytes: "10485760"

  s3Endpoint: "http://gophprofile-minio:9000"
  s3Region: "us-east-1"
  s3Bucket: "avatars"
  s3UsePathStyle: "true"

  rabbitmqExchange: "avatars.exchange"
  rabbitmqUploadQueue: "avatar.uploaded.queue"
  rabbitmqUploadRoutingKey: "avatar.uploaded"
  rabbitmqDeleteQueue: "avatar.deleted.queue"
  rabbitmqDeleteRoutingKey: "avatar.deleted"

  otelEnabled: "false"
  otelExporterEndpoint: "jaeger:4318"

secret:
  create: false

  # Имя Secret.
  name: gophprofile-secret

  databaseDSN: ""
  s3AccessKey: ""
  s3SecretKey: ""
  rabbitmqURL: ""

ingress:
  enabled: false
  className: traefik

  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  host: gophprofile.local
  path: /
  pathType: Prefix

  tls: []

autoscaling:
  server:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  worker:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false

  server:
    enabled: true

  worker:
    enabled: true

  interval: 30s
  scrapeTimeout: 10s

  additionalLabels: {}

networkPolicy:
  enabled: false

rbac:
  create: true
  serviceAccountName: gophprofile-app
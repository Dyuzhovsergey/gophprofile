{{- if and
  .Values.ingress.enabled
  .Values.server.enabled
  (eq .Values.ingress.className "traefik")
  .Values.ingress.traefik.buffering.enabled
}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "gophprofile.uploadBodyLimitMiddlewareName" . }}
  namespace: {{ include "gophprofile.namespace" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.ingress.traefik.buffering.maxRequestBodyBytes }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: gophprofile-secret
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/managed-by: kubectl
type: Opaque

# Скопируйте файл в secret.local.yaml и замените все placeholders
# перед применением манифеста в Kubernetes.
stringData:
  GOPHPROFILE_DATABASE_DSN: "<YOUR_DATABASE_DSN>"
  GOPHPROFILE_S3_ACCESS_KEY: "<YOUR_S3_ACCESS_KEY>"
  GOPHPROFILE_S3_SECRET_KEY: "<YOUR_S3_SECRET_KEY>"
  GOPHPROFILE_RABBITMQ_URL: "<YOUR_RABBITMQ_URL>"
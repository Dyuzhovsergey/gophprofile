apiVersion: batch/v1
kind: Job
metadata:
  name: gophprofile-migrations
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/component: migrations
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gophprofile
        app.kubernetes.io/instance: gophprofile
        app.kubernetes.io/component: migrations
        app.kubernetes.io/part-of: gophprofile
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrate
          image: docker.io/library/gophprofile-migrate:local
          imagePullPolicy: Never

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:
            - name: GOPHPROFILE_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: gophprofile-secret
                  key: GOPHPROFILE_DATABASE_DSN

            - name: GOPHPROFILE_MIGRATIONS_DIR
              value: "/app/migrations"

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

      volumes:
        - name: tmp
          emptyDir: {}
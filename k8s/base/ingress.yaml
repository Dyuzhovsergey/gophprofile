apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gophprofile-upload-body-limit
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/managed-by: kubectl
spec:
  buffering:
    maxRequestBodyBytes: 10485760
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gophprofile-server
  namespace: gophprofile
  labels:
    app.kubernetes.io/name: gophprofile
    app.kubernetes.io/instance: gophprofile
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: gophprofile
    app.kubernetes.io/managed-by: kubectl
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: "Host(`gophprofile.local`) && PathPrefix(`/`)"
      middlewares:
        - name: gophprofile-upload-body-limit
      services:
        - name: gophprofile-server
          port: 80